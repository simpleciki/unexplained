// ── Utilities ──
const fmtAmt = n => '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const stateClass = s => ({ warnings: 'pill-hold', not_cleared: 'pill-wait', clear: 'pill-clear' }[s]);
const statePill = s => ({ warnings: 'Hold', not_cleared: 'Not cleared', clear: 'Clear' }[s]);
const verdictClass = s => ({ warnings: 'c-hold', not_cleared: 'c-wait', clear: 'c-clear' }[s]);

function highlightQuote(text, hl) {
  if (!hl) return esc(text).replace(/\n/g,'<br>');
  const idx = text.toLowerCase().indexOf(hl.toLowerCase());
  if (idx < 0) return esc(text);
  return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + hl.length)) + '</mark>' + esc(text.slice(idx + hl.length));
}

// ── Render sidebar ──
function renderSidebar(active) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-label">Selected documents</div>' +
    DATA.docs.map((d, i) =>
      `<div class="sidebar-item${i === active ? ' on' : ''}" data-idx="${i}">
        <div class="si-row1">
          <div class="si-id">${esc(d.id)}</div>
          <div class="si-amount">${fmtAmt(d.total)}</div>
        </div>
        <div class="si-row2">${esc(d.jobTitle)} · ${esc(d.client)}</div>
        <div class="si-row3"><span class="pill ${stateClass(d.state)}">${statePill(d.state)}</span></div>
      </div>`
    ).join('');
  sb.querySelectorAll('.sidebar-item').forEach(el =>
    el.addEventListener('click', () => select(+el.dataset.idx))
  );
}

// ── Render center ──
function renderMain(d) {
  const m = document.getElementById('main');
  let html = `
    <div class="crumb">${esc(d.job)}<span>·</span>${esc(d.jobTitle)}<span>·</span>${esc(d.client)}</div>
    <div class="doc-head">
      <div class="doc-title">${esc(d.label)}</div>
      <div class="doc-amount">${fmtAmt(d.total)}</div>
    </div>
    <div class="doc-cutoff">Checked as it is about to go out — ${esc(d.cutoff)}</div>`;

  // Verdict card
  const vc = verdictClass(d.state);
  html += `<div class="verdict-card ${vc}">
    <div class="verdict-label">${statePill(d.state)}</div>
    <div class="verdict-text">${esc(d.verdict.text)}</div>
    ${d.verdict.notes.map(n => `<div class="verdict-note">${esc(n)}</div>`).join('')}
    ${d.noRecords ? '<div class="verdict-caveat">No records on file before this quote — nothing to check against.</div>' : ''}
  </div>`;

  // Fired patterns
  if (d.fired.length > 0) {
    d.fired.forEach(p => {
      html += `<div class="pattern-card">
        <div class="pattern-head">
          <span class="pattern-code">${esc(p.code)}</span>
          <span class="pattern-title">${esc(p.title)}</span>
        </div>
        <div class="pattern-explain">${esc(p.explain)}</div>`;
      if (p.quote) {
        html += `<div class="pattern-quote">${highlightQuote(p.quote, p.highlight)}
          <div class="pattern-quote-source">${esc(p.quoteSource)}</div>
        </div>`;
      }
      html += `</div>`;
    });
  }

  // Quiet patterns
  html += `<div class="quiet-section">
    <div class="quiet-label">Patterns that did not fire</div>
    ${d.quiet.map(p => `<div class="quiet-item">
      <span class="quiet-code">${esc(p.code)}</span>
      <span class="quiet-status">${esc(p.status)}</span>
    </div>`).join('')}
  </div>`;

  // Document lines
  html += `<div class="lines-section">
    <div class="lines-label">Document lines</div>
    <table class="lines-table">
      ${d.lines.map(l => `<tr>
        <td class="lkind">${esc(l.kind)}</td>
        <td class="ldesc">${esc(l.desc)}</td>
        <td class="lamt">${fmtAmt(l.amount)}</td>
      </tr>`).join('')}
      <tr class="total-row">
        <td colspan="2" class="total-label">Total</td>
        <td class="lamt total-amt">${fmtAmt(d.total)}</td>
      </tr>
    </table>
  </div>`;

  m.innerHTML = html;
}

// ── Render right panel ──
function renderRight(d) {
  const r = document.getElementById('right');
  let html = '';

  // Evidence timeline
  html += `<div class="rp-label">Evidence, in order</div><div class="ev-timeline">`;
  if (d.evidence.length === 0) {
    html += `<div class="ev-empty">No records on file before this document was submitted.</div>`;
  } else {
    d.evidence.forEach((e, i) => {
      html += `<div class="ev-item${e.alert ? ' alert' : ''}" id="ev-${i}">
        <div class="ev-meta">${esc(e.at)} · ${esc(e.author)} · ${esc(e.type)}</div>
        <div class="ev-summary">${esc(e.summary)}</div>
        <span class="ev-toggle" data-ev="${i}">Show full text</span>
        <div class="ev-full">${esc(e.full)}</div>
      </div>`;
    });
  }
  html += `</div>`;

  // Needs judgment
  // Only records written before the document's cut-off count for this check; later ones are shown apart, never hidden.
  const before = d.needsHuman.filter(nh => !nh.after);
  const later = d.needsHuman.filter(nh => nh.after);
  const nhCount = before.length;
  html += `<div class="nh-section">
    <div class="rp-label">Needs your judgment (${nhCount})</div>`;
  if (nhCount === 0) {
    html += `<div class="nh-empty">No records before this document are waiting for a decision.</div>`;
  } else {
    before.forEach(nh => {
      html += `<div class="nh-item">
        <div class="nh-id">${esc(nh.id)} · ${esc(nh.at)} · ${esc(nh.author)}</div>
        <div class="nh-text">${esc(nh.text)}</div>
        <div class="nh-why">${esc(nh.why)}</div>
        <div><button class="nh-btn" disabled>Judge</button></div>
      </div>`;
    });
  }
  html += `</div>`;
  if (later.length) {
    html += `<div class="nh-section nh-later"><div class="rp-label">Written after this document (${later.length})</div>
      <div class="nh-empty">Not part of this check — the gatekeeper could not have seen ${later.length === 1 ? 'it' : 'them'} when it went out.</div>`;
    later.forEach(nh => { html += `<div class="nh-item"><div class="nh-id">${esc(nh.id)} · ${esc(nh.at)} · ${esc(nh.author)}</div><div class="nh-text">${esc(nh.text)}</div></div>`; });
    html += `</div>`;
  }

  r.innerHTML = html;

  // Toggle evidence expansion
  r.querySelectorAll('.ev-toggle').forEach(btn =>
    btn.addEventListener('click', () => {
      const item = document.getElementById('ev-' + btn.dataset.ev);
      const expanded = item.classList.toggle('expanded');
      btn.textContent = expanded ? 'Hide' : 'Show full text';
    })
  );
}

// ── Selection ──
let current = 0;
function select(idx) {
  if (idx === current) return;
  const main = document.getElementById('main');
  const right = document.getElementById('right');
  main.classList.add('fading');
  right.classList.add('fading');
  setTimeout(() => {
    current = idx;
    renderSidebar(idx);
    renderMain(DATA.docs[idx]);
    renderRight(DATA.docs[idx]);
    main.classList.remove('fading');
    right.classList.remove('fading');
  }, 180);
}

// ── Init ──
renderSidebar(0);
renderMain(DATA.docs[0]);
renderRight(DATA.docs[0]);
</script>
</body>
</html>
