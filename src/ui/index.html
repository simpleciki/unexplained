<!doctype html>

<style>

  :root {

  .topbar { height: 50px; display: flex; align-items: center; gap: 26px; padding: 0 24px; background: rgba(255, 255, 255, 0.82); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--sep2); position: relative; z-index: 20; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }

  .viewsw button { font: inherit; font-size: 12px; padding: 3px 10px; background: none; border: none; color: var(--ink2); cursor: pointer; }
  .viewsw button.on { background: var(--blue); color: #fff; }
  .curated-note { display: inline-block; font-size: 12px; font-weight: 600; color: var(--amber-ink); background: rgba(255, 159, 10, 0.13); border-radius: 6px; padding: 3px 8px; margin-bottom: 8px; }
  .pick { font-size: 11px; font-weight: 600; color: var(--red-ink); margin-left: 6px; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; height: calc(100vh - 50px - var(--value-h, 76px)); }
  .sidebar { background: var(--sidebar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-right: 1px solid var(--sep2); overflow-y: auto; padding: 10px 0 30px; }

  .job { padding: 9px 16px; cursor: pointer; transition: background 220ms var(--spring); }
  .job:hover { background: rgba(0, 0, 0, 0.04); }
  .job.on { background: rgba(10, 99, 209, 0.07); }
  .job-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .job-id { font: 600 12px/1.4 var(--mono); }
  .job-need { font-size: 12px; color: var(--amber-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .section-label { font-size: 12px; font-weight: 600; color: var(--ink3); margin: 22px 0 8px; }
  .pattern { border-radius: 12px; border: 1px solid var(--sep2); background: var(--card); padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }

  .qb-who { color: var(--ink); margin-bottom: 4px; white-space: normal; }
  .quote-block { margin-top: 10px; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink2); border-left: 3px solid var(--sep); white-space: pre-wrap; }

  .used { color: var(--amber-ink); font-weight: 600; }

  table.lines { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.lines td { padding: 7px 0; border-top: 1px solid var(--sep2); vertical-align: top; }
  table.lines td.k { color: var(--ink3); font: 12px var(--mono); padding-right: 12px; white-space: nowrap; }

  table.lines tr.total td { border-top: 1px solid var(--ink2); font-weight: 600; color: var(--ink); padding-top: 10px; }

  .rp-label { font-size: 12px; font-weight: 600; color: var(--ink3); margin: 4px 0 12px; }
  .rp-label.later { margin-top: 22px; }
  .timeline { margin-bottom: 24px; }
  .ev { position: relative; padding: 0 0 16px 20px; }
  .ev::before { content: ""; position: absolute; left: 3px; top: 5px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink3); background: var(--card); }
  .ev.alert::before { border-color: var(--red); }
  .ev::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1px; background: var(--sep2); }
  .ev:last-child::after { display: none; }
  .ev-meta { font-size: 12px; color: var(--ink3); }
  .ev-sum { font-size: 13px; margin-top: 1px; }
  .ev-who { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .toggle { font-size: 12px; color: var(--blue); cursor: pointer; display: inline-block; margin-top: 3px; background: none; border: none; padding: 0; }
  .ev-full { display: none; font-size: 13px; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 6px; white-space: pre-wrap; }
  .ev.open .ev-full { display: block; }
  .empty { font-size: 13px; color: var(--ink3); }

  .nh { border: 1px solid var(--sep2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--card); }
  .nh-id { font: 500 12px/1.3 var(--mono); color: var(--ink3); margin-bottom: 5px; }
  .nh-text { font-size: 13px; margin-bottom: 6px; }
  .nh-why { font-size: 12px; color: var(--amber-ink); }
  .nh.spot .nh-why, .nh.done .nh-why { color: var(--ink3); }
  .nh .done-line { font-size: 13px; color: var(--green-ink); margin-bottom: 4px; }
  .nh .cand { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .nh .hist { font-size: 12px; color: var(--ink3); margin-top: 4px; border-left: 2px solid var(--sep); padding-left: 8px; }
  .q-open { color: var(--amber-ink); font-weight: 600; }
  .btn { font-size: 13px; font-weight: 500; border: 1px solid var(--sep); border-radius: 7px; padding: 5px 12px; background: var(--card); cursor: pointer; transition: background 160ms var(--spring), border-color 160ms var(--spring); }

  .btn:disabled { opacity: 0.45; cursor: default; }
  .nh .btn { margin-top: 10px; }
  details.group { margin-top: 18px; }
  details.group > summary { font-size: 12px; font-weight: 600; color: var(--ink3); margin-bottom: 10px; list-style: none; }
  details.group > summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: transform 200ms var(--spring); }
  details.group[open] > summary::before { transform: rotate(90deg); }
  .later-box { opacity: 0.72; }

  /* Lists in main (Needs you, Ledger, job view) */
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .page-sub { font-size: 13px; color: var(--ink3); margin: 3px 0 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--sep2); }
  table.ledger th, table.ledger td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--sep2); }
  table.ledger th { font-size: 12px; color: var(--ink3); font-weight: 600; }
  table.ledger td.n, table.ledger th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .doclist .doc { padding: 10px 14px; border-radius: 10px; background: var(--card); margin-bottom: 8px; box-shadow: 0 0 0 1px var(--sep2); }

  /* The judgment sheet: slides in from the right, over the right panel */
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.12); opacity: 0; pointer-events: none; transition: opacity 260ms var(--spring); z-index: 40; }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 92vw); background: rgba(255, 255, 255, 0.96); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); box-shadow: -12px 0 40px rgba(0, 0, 0, 0.12); transform: translateX(104%); transition: transform 340ms var(--spring); z-index: 50; overflow-y: auto; padding: 22px 24px 60px; }
  .sheet.on { transform: none; }
  .sheet-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }

  .sheet-close { margin-left: auto; }

  .rtext { font-size: 15px; line-height: 1.6; padding: 12px 14px; border: 1px solid var(--sep); border-radius: 10px; background: #fffef9; cursor: text; user-select: text; }

  .rowbox { border: 1px solid var(--sep); border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: #fcfcfd; }

<body>
<div class="topbar">
  <a class="brand" href="/" title="The call: one job, start to finish">unexplained</a>
  <div class="tab on" data-tab="outbox">Outbox</div>
  <div class="tab" data-tab="needs">Needs you<span class="count" id="needs-count"></span></div>
  <div class="tab" data-tab="ledger">Ledger</div>
  <div id="ledger">loading…</div>
  <label class="reviewer">Reviewer <input id="reviewer" autocomplete="off"></label>
</div>
<div class="value" id="value"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"></main>
  <section class="right" id="right"></section>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: Number(n) % 1 ? 2 : 0 }).format(Number(n));
const money2 = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(Number(n));
const day = (iso) => String(iso ?? "").replace("T", " ").slice(0, 16);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const shortDate = (iso) => (iso ? `${Number(iso.slice(8, 10))} ${MONTHS[Number(iso.slice(5, 7)) - 1]}` : "");
const api = async (path, opts) => { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok && r.status !== 400) throw new Error((j.errors || []).join("; ") || r.status); return { status: r.status, body: j }; };
const S = { meta: null, jobs: [], job: null, doc: null, tab: "outbox", people: new Map(), drafts: {}, sheet: null, view: "sample", viewIds: null, picks: new Map(), toConfirm: {}, summary: null };
const nameOf = (id) => S.people.get(id)?.name ?? id;
// A not-cleared document reads as the work left on it ("2 left to confirm"), not as blocked. Without a count
// (nothing a person can confirm, e.g. only the Judge step is open) it says "Not cleared".
const STATE = { warnings: "Fix before sending", not_cleared: "Not cleared", clear: "Clear" };
const leftText = (n) => `${n} left to confirm`;
const pill = (s, left) => (s ? `<span class="pill ${s}">${s === "not_cleared" && left ? leftText(left) : STATE[s]}</span>` : "");

// Reviewer name: remembered in this browser only (a convenience; the judgment file is the record).
const reviewerEl = $("#reviewer");
try { reviewerEl.value = localStorage.getItem("unexplained.reviewer") || "Ciki"; } catch { reviewerEl.value = "Ciki"; }
reviewerEl.addEventListener("change", () => { try { localStorage.setItem("unexplained.reviewer", reviewerEl.value.trim()); } catch {} });

// ---------- top bar, value strip, sidebar ----------

async function loadLedger() {
  const { body } = await api("/api/ledger");
  const el = $("#ledger");
  el.textContent = body.line;
  el.title = body.line;
  el.classList.toggle("bad", !body.complete);
  $("#needs-count").textContent = body.counts.needs_human ? ` ${body.counts.needs_human}` : "";
  S.ledger = body;
}

// Documents checked and the money in each verdict state. "Checked", never "saved".
// The view switch: "All documents" (the default) or the curated mix, labelled as curated on screen.
// The view switch: "Today's outbox" (the default: a sample day drawn at the builder's 2-in-10 ratio), all
// documents, or the curated mix; each labelled on screen. The header reads as a to-do list from the API's
// counts for the view in use.
async function loadValue() {
  const s = (await api(`/api/summary?view=${S.view}`)).body;
  S.summary = s;
  S.viewIds = s.ids ? new Set(s.ids) : null;
  S.picks = new Map((s.picks || []).map((p) => [p.doc, p]));
  S.toConfirm = s.to_confirm.per_doc;
  const sw = (v, label) => `<button data-view="${v}" class="${S.view === v ? "on" : ""}">${label}</button>`;
  const pct = (n) => (s.total ? (n / s.total) * 100 : 0);
  const b = s.by_state;
  const quick = Object.keys(s.to_confirm.per_doc).length;
  const waiting = b.not_cleared.n - quick;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  $("#value").innerHTML = `
    <div class="todo"><span class="fix">${b.warnings.n} to fix before sending</span> · <span class="chk">${plural(quick, "quick check", "quick checks")} (${plural(s.to_confirm.items, "item", "items")})</span>${waiting ? ` · ${waiting} waiting on the Judge step` : ""} · <span class="ok">${b.clear.n} ready to send</span></div>
    <div class="value-line"><strong>${s.documents} documents · ${money(s.total)}</strong> checked before they went out
      <span class="viewsw">${sw("sample", "Today's outbox")}${sw("all", `All ${s.all_documents} documents`)}${sw("curated", "Curated: one example per problem + all clean documents")}</span></div>
    ${S.view === "sample" ? `<div class="sample-note">A sample day: ${s.documents} documents, drawn at random at the builder's 2-in-10 ratio. <a data-view="all">See all ${s.all_documents}.</a></div>` : ""}
    ${S.view === "curated" ? `<div class="curated-note">Curated view — ${S.picks.size} problem examples (one per pattern, P1–P7) and ${s.documents - S.picks.size} documents designed clean. Not the whole outbox.</div>` : ""}
    <div class="bar"><div style="width:${pct(b.warnings.total)}%;background:var(--red)"></div><div style="width:${pct(b.not_cleared.total)}%;background:var(--amber)"></div><div style="width:${pct(b.clear.total)}%;background:var(--green)"></div></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--red)"></i>Fix before sending · ${b.warnings.n} · ${money(b.warnings.total)}</span>
      <span><i class="dot" style="background:var(--amber)"></i>Not cleared until a person confirms · ${b.not_cleared.n} · ${money(b.not_cleared.total)}</span>
      <span><i class="dot" style="background:var(--green)"></i>Cleared · ${b.clear.n} · ${money(b.clear.total)}</span>
    </div>`;
  setValueHeight();
}
// The panes fill what the value strip leaves; measured again when the window changes size (the strip wraps).
const setValueHeight = () => document.documentElement.style.setProperty("--value-h", `${$("#value").offsetHeight}px`);
window.addEventListener("resize", setValueHeight);

async function loadJobs() {
  S.jobs = (await api("/api/jobs")).body;
  renderSidebar();
}

$("#value").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-view]");
  if (!b || b.dataset.view === S.view) return;
  S.view = b.dataset.view;
  await loadValue();
  if (S.tab === "outbox" && !S.doc && !S.job) await go({});
  else renderSidebar();
});

function renderSidebar() {
  const docsOf = (j) => (S.viewIds ? j.docs.filter((d) => S.viewIds.has(d.id)) : j.docs);
  const jobs = S.jobs.filter((j) => docsOf(j).length);
  $("#sidebar").innerHTML = `<div class="side-label">${S.view === "sample" ? "Today's outbox: the jobs and documents in it" : S.viewIds ? "Curated: the jobs and documents in this view" : "Jobs and their documents"}</div>` + jobs.map((j) => `
    <div class="job ${S.job === j.job && !S.doc ? "on" : ""}" data-job="${esc(j.job)}">
      <div class="job-row"><span class="job-id">${esc(j.job)}</span>${j.needs_human ? `<span class="job-need">${j.needs_human} need you</span>` : ""}</div>
      <div class="job-title">${esc(j.title)} · ${esc(j.client)}</div>
    </div>
    ${S.job === j.job || S.viewIds ? `<div class="docs">${docsOf(j).map((d) => `<div class="doc ${S.doc === d.id ? "on" : ""}" data-doc="${esc(d.id)}" title="${esc(day(d.at))}">
      <i class="sdot ${d.state}"></i><span class="doc-id">${esc(d.id)}</span>${S.picks.has(d.id) ? `<span class="pick" title="${esc(S.picks.get(d.id).why)}">${esc(S.picks.get(d.id).pattern)}</span>` : ""}<span class="doc-amt">${money2(d.total)}</span></div>`).join("")}</div>` : ""}`).join("");
  $("#sidebar .doc.on, #sidebar .job.on")?.scrollIntoView({ block: "nearest" });
}

$("#sidebar").addEventListener("click", (e) => {
  const d = e.target.closest("[data-doc]");
  if (d) return go({ tab: "outbox", doc: d.dataset.doc });
  const j = e.target.closest("[data-job]");
  if (j) return go({ tab: "outbox", job: j.dataset.job });
});

// The Outbox tab goes back to the outbox list of the view in use.
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => go(t.dataset.tab === "outbox" ? { tab: "outbox", job: null } : { tab: t.dataset.tab })));

// One place that switches what is shown, with the calm cross-fade.
async function go(to) {
  closeSheet();
  if (to.tab) S.tab = to.tab;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === S.tab));
  if (to.doc !== undefined) { S.doc = to.doc; }
  if (to.job !== undefined) { S.job = to.job; S.doc = null; }
  const panes = [$("main"), $(".right")];
  panes.forEach((p) => p.classList.add("fading"));
  await new Promise((r) => setTimeout(r, 160));
  try {
    if (S.tab === "needs") await showNeeds();
    else if (S.tab === "ledger") await showLedger();
    else if (S.doc) await showDoc(S.doc);
    else if (S.job) await showJob(S.job);
    else await showOutbox();
  } finally {
    renderSidebar();
    panes.forEach((p) => p.classList.remove("fading"));
  }
  try { history.replaceState(null, "", S.doc && S.tab === "outbox" ? `#doc=${S.doc}` : location.pathname); } catch {}
}

// ---------- document check ----------

async function showDoc(id) {
  const c = (await api(`/api/check?doc=${encodeURIComponent(id)}`)).body;
  S.job = c.doc.job;
  S.check = c;
  const j = S.jobs.find((x) => x.job === c.doc.job);
  const fired = c.warnings.filter((w) => w.fired);
  const quiet = c.warnings.filter((w) => !w.fired);
  const title = c.doc.kind === "invoice" ? `Invoice ${c.doc.id}` : `Quote ${c.doc.id}`;
  $("main").innerHTML = `
    <div class="crumb">${esc(c.doc.job)}<i>·</i>${esc(j?.title)}<i>·</i>${esc(j?.client)}</div>
    <div class="doc-head"><div class="doc-title">${esc(title)}</div><div class="doc-total">${money2(c.doc.total)}</div></div>
    <div class="cutoff">${esc(c.doc.at)} · Checked as it is about to go out — ${esc(c.cutoff)}</div>
    <div class="verdict ${c.verdict.state}">${c.verdict.state === "not_cleared" && c.to_confirm.length ? `${pill("not_cleared", c.to_confirm.length)}` : pill(c.verdict.state)}
      <div class="verdict-text">${c.verdict.state === "warnings" ? `Fix before sending — ${esc(c.verdict.text)}` : c.verdict.state === "not_cleared" && c.to_confirm.length ? `${leftText(c.to_confirm.length)} — not cleared until a person confirms ${c.to_confirm.length === 1 ? "it" : "them"}` : esc(c.verdict.text)}</div>
      ${fired.length ? `<div class="fixes">${fired.map(fixHtml).join("")}</div>` : ""}
      ${c.verdict.notes.map((n) => `<div class="verdict-note">${emph(n)}</div>`).join("")}
      ${c.to_confirm.map(toConfirmHtml).join("")}
    </div>
    ${fired.length ? `<div class="section-label">Triggered rules</div>${fired.map(patternHtml).join("")}` : ""}
    ${clientMemoryHtml(c)}
    <div class="section-label">Patterns that did not fire</div>
    ${quiet.map((w) => `<div class="quiet"><span class="code">${w.pattern}</span><span>${esc(w.title)} — ${esc(w.status)}</span></div>`).join("")}
    <div class="section-label">Document lines</div>
    ${linesHtml(c.doc.lines, c.doc.total)}`;
  $(".right").innerHTML = evidenceHtml(fired) + queuePanel(c.queue, true);
}

// One item a person confirms, in place: the record (who, when, the text), why it needs a person, and the quick
// actions the judgment form already supports. "Looks fine" is the form's "Nothing to keep" in one click (the
// reason it records says it was a quick check from the outbox); anything else opens the usual form.
const QUICK_REASON = "Quick check from the outbox: read the record, nothing to keep.";
function toConfirmHtml(x) {
  if (x.kind === "first_quote") {
    // Confirmed in place against what this client told us before (recalled from H-MEM, listed below); the reason
    // is prefilled and editable, and required.
    const n = S.check.client_memory.items.length;
    const reason = n ? `Checked against what this client told us before (${n} item${n === 1 ? "" : "s"}).` : "No earlier word from this client on file; checked the quote by hand.";
    return `<div class="tc" data-firstq="${esc(S.check.doc.id)}" data-n="${n}"><div class="tc-why">${esc(x.why)}</div>
      <div class="tc-meta">${n ? `${n} thing${n === 1 ? "" : "s"} this client told us before are listed under “What this client told us before”.` : "Nothing this client told us before is on file by this quote's cut-off."}</div>
      <input class="reason" data-firstq-reason value="${esc(reason)}" aria-label="Reason">
      <button class="btn primary" data-confirm-first="${esc(S.check.doc.id)}">${n ? "Checked against this client's history — OK to send" : "Checked by hand — OK to send"}</button><span class="err" data-err></span></div>`;
  }
  for (const q of [S.check.queue.needs_human, S.check.queue.spot_check, S.check.queue.confirmed]) for (const it of q) ITEMS.set(it.record_id, it);
  const actions = x.kind === "open_question"
    ? `<button class="btn" data-judge="${esc(x.record_id)}">Judge this record again</button><span class="tc-meta">Answer the question, then keep the cards without it.</span>`
    : `<button class="btn primary" data-quick="${esc(x.record_id)}">Looks fine — nothing to keep</button><button class="btn" data-judge="${esc(x.record_id)}">This holds a decision…</button>`;
  return `<div class="tc" data-rec="${esc(x.record_id)}"><div class="tc-meta">${B(shortDate(x.at))} · ${B(nameOf(x.author))} · ${esc(x.source_type.replaceAll("_", " "))} · ${esc(x.record_id)}</div>
    <div class="tc-text">${esc(x.text)}</div><div class="tc-why">${esc(x.why)}</div>${actions}<span class="err" data-err></span></div>`;
}

// "What this client told us before": recalled from Meterless H-MEM for this client and its jobs, by the cut-off,
// not superseded by then. Rules first, then approvals and rejections, then the rest; newest first in each.
const MEM_KIND = { rule: "Rule", decision: "Approval / rejection", other: "Other" };
function clientMemoryHtml(c) {
  const m = c.client_memory;
  const d = m.dropped;
  return `<div class="section-label">What this client told us before (${m.items.length})</div>
    <div class="hint">Recalled from H-MEM: ${m.recalled} memories ranked; shown are this client's and its jobs', learned by the cut-off and not superseded by then (left out: ${d.other_scope} other clients, ${d.after_cutoff} later, ${d.superseded} superseded). It informs the person; it does not decide the verdict.</div>
    ${m.items.length ? m.items.map((x) => `<div class="mem ${x.kind}">
      <div class="mem-meta"><span class="mem-kind">${esc(MEM_KIND[x.kind])}</span> · ${x.who_name ? B(x.who_name) : "—"} · ${B(x.learned)} · ${esc(x.scope)}${x.disagree ? ` · <span class="disagree">memory and decision table disagree</span>` : ""}</div>
      <span class="said">“${esc(x.text)}”</span>
      <details><summary class="mem-meta">Source ${esc(x.record_id)}${x.source_type ? ` · ${esc(x.source_type.replaceAll("_", " "))}` : ""}</summary><div class="mem-src">${marked(x.record_text ?? "", x.text)}</div></details>
    </div>`).join("") : `<div class="empty">Nothing from this client on file by this document's cut-off.</div>`}`;
}

// Person, date and money in bold (money in tabular figures); only those tokens, never whole sentences.
const B = (v) => `<b>${esc(v)}</b>`;
const BM = (v) => `<b class="num">${esc(v)}</b>`;

// A finding sentence from its segments. A quote a person said goes on its own line under the name and
// date, in the quote style; other quoted words stay inline.
function segHtml(segs) {
  const lines = [[]];
  for (const x of segs) {
    if (x.k === "quote" && x.said) { lines.push({ said: x.v }); lines.push([]); continue; }
    const cur = lines[lines.length - 1];
    if (x.k === "person" || x.k === "date") cur.push(B(x.v));
    else if (x.k === "money") cur.push(BM(x.v));
    else if (x.k === "doc") cur.push(`<span class="docid">${esc(x.v)}</span>`);
    else if (x.k === "quote") cur.push(`“${esc(x.v)}”`);
    else cur.push(esc(x.v));
  }
  return lines.map((l) => (Array.isArray(l) ? (l.join("").trim() ? `<span class="fl">${l.join("").trim()}</span>` : "") : `<span class="said">“${esc(l.said)}”</span>`)).join("");
}

// Free text from the API (verdict notes): names, dates, money and numbers in bold, ids left alone. Works on the
// raw text and escapes each piece, so an escaped character is never split.
function emph(text) {
  const names = [...new Set([...S.people.values()].map((p) => p.name).concat([reviewerEl.value.trim()]).filter(Boolean))].sort((a, b) => b.length - a.length);
  const nameAlt = names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp(`([−+]?\\$[\\d,]+(?:\\.\\d+)?)|(\\b\\d{1,2} (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\\b)|((?<![\\w-])\\d{1,2}\\/\\d{1,2}(?![\\w-]))|((?<![\\w.$-])\\d+(?![\\w.-]))${nameAlt ? `|\\b(${nameAlt})\\b` : ""}`, "g");
  let out = "", last = 0;
  for (const m of String(text ?? "").matchAll(re)) {
    out += esc(text.slice(last, m.index)) + (m[1] ? BM(m[0]) : B(m[0]));
    last = m.index + m[0].length;
  }
  return out + esc(String(text ?? "").slice(last));
}

// The source record with the quoted words marked: the gatekeeper always sees where a claim comes from.
function marked(text, quote) {
  const t = esc(text);
  return quote && text.includes(quote) ? t.replace(esc(quote), `<mark>${esc(quote)}</mark>`) : t;
}

// The quiet line under a quote: what kind of statement it is and who read it.
function kindLine(e) {
  if (e.kind !== "card") return "";
  return `<span class="${e.mode_chosen && e.mode_chosen !== e.mode ? "used" : ""}">${esc(modeText(e.mode_chosen ?? e.mode, e.mode, e.mode_note))}</span> · ${e.by === "person" ? `<span class="person">confirmed by a person</span>` : "read by the model"}`;
}

// A fired warning in the red box: pattern id and name, its one step to fix (none when the flag lacks a detail the
// fix needs), and a jump to its evidence under "Triggered rules".
function fixHtml(w) {
  return `<div class="fix-item">
    <div class="pattern-head"><span class="code">${w.pattern}</span><span class="pattern-title">${esc(w.title)}</span></div>
    ${(w.fix_segments || []).map((f) => `<p class="fix">${segHtml(f)}</p>`).join("")}
    <button class="fix-ev" data-jump="pat-${esc(w.pattern)}">See the evidence ↓</button>
  </div>`;
}

function patternHtml(w) {
  const cards = w.evidence.filter((e) => e.kind === "card" && e.source).slice(0, 2);
  return `<div class="pattern" id="pat-${esc(w.pattern)}">
    <div class="pattern-head"><span class="code">${w.pattern}</span><span class="pattern-title">${esc(w.title)}</span></div>
    ${(w.finding_segments || []).map((f) => `<p class="finding">${segHtml(f)}</p>`).join("")}
    ${cards.map((e) => `<div class="quote-block"><div class="qb-who">${B(nameOf(e.decided_by))} · ${B(shortDate(e.decided_at))}</div>${marked(e.source.text, e.quote)}
      <div class="quote-src">${kindLine(e)} · ${esc(e.source.record_id)}${e.confirmed ? ` · <span class="person">${esc(e.confirmed)}</span>` : ""}</div></div>`).join("")}
    <details class="engine"><summary>Engine details</summary><pre class="json">${esc(JSON.stringify(w.details, null, 2))}</pre></details>
  </div>`;
}

function linesHtml(lines, total) {
  if (!lines?.length) return `<div class="empty">No lines.</div>`;
  return `<table class="lines">${lines.map((l) => `<tr><td class="k">${esc(l.kind ?? l.category)}</td><td class="d">${esc(l.description)}</td><td class="q">${esc(l.qty)} × ${money2(l.unit_price)}</td><td class="a">${money2(l.amount)}</td></tr>`).join("")}
    <tr class="total"><td colspan="3">Total</td><td class="a">${money2(total)}</td></tr></table>`;
}

// Evidence of the triggered rules, one entry per source, in time order; the full text opens in place.
function evidenceHtml(fired) {
  const items = new Map();
  for (const w of fired) for (const e of w.evidence) {
    if (!e.source) continue;
    const key = `${e.source.record_id}|${e.kind === "card" ? e.id : ""}`;
    if (!items.has(key)) items.set(key, { ...e, patterns: [w.pattern] });
    else items.get(key).patterns.push(w.pattern);
  }
  const list = [...items.values()].sort((a, b) => Date.parse(a.source.at) - Date.parse(b.source.at));
  return `<div class="rp-label">Evidence, in order</div><div class="timeline">${list.length ? list.map((e, i) => `
    <div class="ev alert" id="ev-${i}">
      <div class="ev-meta">${B(shortDate(e.source.at))} · ${B(nameOf(e.source.author))} · ${esc(e.source.type.replaceAll("_", " "))} · ${e.patterns.join(" ")}</div>
      <div class="ev-sum">${e.kind === "card" ? `<span class="said">“${esc(e.quote)}”</span>` : esc(e.source.text.length > 110 ? e.source.text.slice(0, 108) + "…" : e.source.text)}</div>
      ${e.kind === "card" ? `<div class="ev-who">${kindLine(e)}</div>` : ""}
      <button class="toggle" data-ev="${i}">Show full text</button>
      <div class="ev-full">${marked(e.source.text, e.kind === "card" ? e.quote : null)}<div class="quote-src">${esc(e.source.record_id)} · ${esc(day(e.source.at))}</div></div>
    </div>`).join("") : `<div class="empty">No rule fired, so there is no evidence to show.</div>`}</div>`;
}

// ---------- queue: needs you / spot-check / confirmed / written after ----------

const ITEMS = new Map(); // record id -> queue item, for the sheet and for defaults when a quote is selected

function queuePanel(q, forDoc) {
  for (const x of [...q.needs_human, ...q.spot_check, ...q.confirmed, ...(q.after || [])]) ITEMS.set(x.record_id, x);
  const later = q.after || [];
  return `
    <div class="rp-label">Needs your judgment (${q.needs_human.length})</div>
    ${q.needs_human.length ? q.needs_human.map((x) => nhHtml(x, "need")).join("") : `<div class="empty">${forDoc ? "No record before this document is waiting for a decision." : "Nothing waiting on this job."}</div>`}
    <details class="group"><summary>Model found nothing here — spot-check (${q.spot_check.length})</summary>
      ${q.spot_check.length ? q.spot_check.map((x) => nhHtml(x, "spot")).join("") : `<div class="empty">None.</div>`}
    </details>
    ${q.confirmed.length ? `<details class="group" open><summary>Confirmed by a person (${q.confirmed.length})</summary>${q.confirmed.map(confirmedHtml).join("")}</details>` : ""}
    ${later.length ? `<div class="later-box"><div class="rp-label later">Written after this document (${later.length}) — not part of this check</div>
      ${later.map((x) => nhHtml(x, x.bucket === "auto_empty" ? "spot" : "need")).join("")}</div>` : ""}`;
}

function nhHtml(x, kind) {
  return `<div class="nh ${kind}"><div class="nh-id">${B(shortDate(x.recorded_at))} · ${B(nameOf(x.author))} · ${esc(x.source_type.replaceAll("_", " "))} · ${esc(x.record_id)}</div>
    <div class="nh-text">${esc(x.text)}</div>
    <div class="nh-why">${esc(x.why)}</div>
    ${x.candidates.map((c) => `<div class="cand">model candidate: ${esc(typeLabel(c.mode))} · ${B(nameOf(c.decided_by))}<span class="said">“${esc(c.quote)}”</span></div>`).join("")}
    <button class="btn" data-judge="${esc(x.record_id)}">Judge</button></div>`;
}

// The four card types in plain words. The examples are the invented ones from the Researcher prompt
// (src/agents/researcher.ts), never text from the job records.
const TYPES = {
  decides: { label: "Decision", help: "The client approves, rejects, or sets or withdraws a rule; also a client decision someone else logged.", example: "Yes, that works. Use the cedar boards on the north side." },
  gives_reason: { label: "Reason", help: "Why: why something was rejected, why a price changed, why something is needed.", example: "We can't accept the glazing quote: it charges for six panes and only two are broken." },
  proposes: { label: "Promise / open item", help: "Something someone will do or find out later.", example: "We'll measure the stairwell again on Monday and send a revised number by Wednesday." },
  mentions: { label: "Mentions", help: "Refers to an existing practice, decision or state without making a new one.", example: "I haven't signed off on the shed roof yet." },
};
const typeLabel = (m) => TYPES[m]?.label ?? m;

// "Decision → used as Mentions (…)" when the engine's decider rule changes the mode the person chose.
const modeText = (chosen, used, why) => used && used !== chosen
  ? `${typeLabel(chosen)} → used as ${typeLabel(used)}${why ? ` (${why})` : ""}`
  : typeLabel(chosen);

function cardLine(c, m) {
  return `<div class="cand"><div><span class="${m && m.used !== m.chosen ? "used" : ""}">${esc(modeText(c.mode, m?.used, m?.why))}</span> · ${B(nameOf(c.decided_by))} · ${esc(c.topic)} · effective from ${c.effective ? B(day(c.effective)) : "the message time"}</div>
    <span class="said">“${esc(c.quote)}”</span>
    ${c.open_question ? `<div class="q-open">Open question: ${esc(c.open_question)}</div>` : ""}</div>`;
}

function historyHtml(x) {
  return (x.history || []).map((h) => `<div class="hist">replaces the judgment of ${B(day(h.judged_at))} by ${B(h.reviewer)}: ${esc(h.verdict === "cards" ? h.types.map(typeLabel).join(", ") : "nothing to keep")} — ${esc(h.reason)}</div>`).join("");
}

function confirmedHtml(x) {
  const j = x.judgment;
  return `<div class="nh done"><div class="nh-id">${B(shortDate(x.recorded_at))} · ${B(nameOf(x.author))} · ${esc(x.record_id)}</div>
    <div class="done-line">${j?.verdict === "no_decision" ? "Nothing to keep" : "Kept"} — ${B(j?.reviewer)}, ${B(day(j?.judged_at))}: ${esc(j?.reason)}</div>
    ${(j?.cards || []).map((c, i) => cardLine(c, x.card_modes?.[i])).join("")}
    ${historyHtml(x)}
    <button class="btn" data-judge="${esc(x.record_id)}">Judge this record again</button></div>`;
}

// ---------- the judgment sheet ----------

function openSheet(rec) {
  const x = ITEMS.get(rec);
  if (!x) return;
  S.sheet = rec;
  const d = (S.drafts[rec] ??= { rows: [], reason: "" });
  const again = x.bucket === "human_confirmed";
  $("#sheet").innerHTML = `<div data-rec="${esc(rec)}">
    <div class="sheet-head"><div class="sheet-title">${again ? "Judge this record again" : "Your judgment"}</div><button class="btn sheet-close" data-close>Close</button></div>
    <div class="meta">${esc(x.record_id)} · ${esc(x.source_type.replaceAll("_", " "))} · ${esc(nameOf(x.author))} · ${esc(day(x.recorded_at))}${x.job ? ` · ${esc(x.job)}` : ""}</div>
    <div class="why">${esc(again ? "The new judgment replaces the current one; the history stays." : x.why)}</div>
    ${again ? `<div class="nh done">${(x.judgment?.cards || []).map((c, i) => cardLine(c, x.card_modes?.[i])).join("") || `<div class="cand">Nothing kept.</div>`}${historyHtml(x)}</div>` : ""}
    <div class="rtext" data-text="${esc(rec)}">${esc(x.text)}</div>
    <div class="hint" data-hint>${hintText(d)}</div>
    ${x.candidates.map((c) => `<div class="cand">model candidate: ${esc(typeLabel(c.mode))} · ${esc(nameOf(c.decided_by))} · ${esc(c.topic)}: “${esc(c.quote)}”</div>`).join("")}
    <div class="rows">${d.rows.map((r, i) => rowHtml(r, i)).join("")}</div>
    <textarea placeholder="Reason (required): what you read in this record and why" data-reason="${esc(rec)}">${esc(d.reason)}</textarea>
    <div class="actions"><button class="btn primary" data-act="cards" ${d.rows.length ? "" : "disabled"}>${confirmLabel(d)}</button><span class="err" data-err></span></div>
    <div class="nothing"><button class="btn" data-act="none">Nothing to keep in this record</button>
      <div class="hint">Use this only when the record holds no decision, reason, promise or reference.</div></div>
  </div>`;
  $("#sheet").classList.add("on");
  $("#sheet").setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
}

function closeSheet() {
  S.sheet = null;
  $("#sheet").classList.remove("on");
  $("#sheet").setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
}
$("#backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

const hintText = (d) => d.rows.length
  ? "Select more words for another card — one record can hold several decisions."
  : "Select the words that state a decision, reason, promise or reference. Each selection becomes an exact quote.";
const confirmLabel = (d) => `Keep ${d.rows.length > 1 ? d.rows.length + " cards" : "this card"}`;

function rowHtml(r, i) {
  const opts = (vals, cur, label = (v) => v) => vals.map((v) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label(v))}</option>`).join("");
  const t = TYPES[r.mode];
  return `<div class="rowbox" data-i="${i}">
    <div class="row"><span class="q">“${esc(r.quote)}”</span>
      <select data-f="mode" aria-label="Type">${opts(Object.keys(TYPES), r.mode, typeLabel)}</select>
      <button class="x" data-act="drop" title="Remove">×</button></div>
    <div class="row-fields">
      <label>Who decided<select data-f="decided_by">${opts(S.meta.people.map((p) => p.id), r.decided_by, (id) => `${nameOf(id)} (${S.people.get(id)?.role ?? ""})`.slice(0, 52))}</select></label>
      <label>Topic<select data-f="topic"><option value="">choose…</option>${opts(S.meta.topics, r.topic, (t) => t.replace("_", " "))}</select></label>
      <label>Effective from<span class="eff"><input type="date" data-f="eff_date" value="${esc(r.eff_date)}"><input type="time" data-f="eff_time" value="${esc(r.eff_time)}"></span>
        <span class="from">${r.eff_from === "your edit" ? "set by you" : r.eff_from ? `prefilled from ${esc(r.eff_from)}` : "…"}</span></label>
      <label>Has a question<input type="text" data-f="question" placeholder="optional: what is still unclear" value="${esc(r.question)}"></label>
    </div>
    <div class="typehelp">${esc(t.label)}: ${esc(t.help)} <i>e.g. “${esc(t.example)}”</i></div>
    <div class="typehelp">Has a question: blocks this job's documents from Clear until it is answered. Use it for a gap that could change this document's result.</div>
    ${deciderWarningHtml(r)}
  </div>`;
}

// The engine reads a Decision by someone who is not a client decider for the topic as Mentions (a contractor
// can only propose). Say so before submit and offer the two honest types; keeping it is allowed.
function deciderWarningHtml(r) {
  if (r.mode !== "decides") return "";
  const d = S.meta.deciders || {};
  const allowed = r.topic ? d[r.topic] : [...new Set(Object.values(d).flat())];
  if (!allowed || allowed.includes(r.decided_by)) return "";
  return `<div class="dwarn">${esc(nameOf(r.decided_by))} is not a client decider${r.topic ? ` for ${esc(r.topic.replace("_", " "))}` : ""}. The system will read this card as Mentions.
    Choose <button class="btn" data-act="tomode" data-mode="proposes">Promise / open item</button> or <button class="btn" data-act="tomode" data-mode="mentions">Mentions</button> — or keep it, and it will be shown as Mentions.</div>`;
}

function itemOf(el) { const c = el.closest("[data-rec]"); return c && c.dataset.rec; }
// Only the quote rows, the hint and the keep button change while a person works; rebuild them in place.
function rerenderItem(rec) {
  const d = S.drafts[rec];
  const card = document.querySelector(`#sheet [data-rec="${CSS.escape(rec)}"]`);
  if (!card) return;
  card.querySelector(".rows").innerHTML = d.rows.map((r, i) => rowHtml(r, i)).join("");
  card.querySelector("[data-hint]").textContent = hintText(d);
  const b = card.querySelector('[data-act="cards"]');
  b.disabled = !d.rows.length;
  b.textContent = confirmLabel(d);
}

// A selection inside the record's text becomes a quote row (exact words only), with "effective from"
// prefilled from a time phrase in those words, or the message time.
document.addEventListener("mouseup", async (e) => {
  const box = e.target.closest?.("[data-text]");
  if (!box) return;
  const sel = window.getSelection().toString().replace(/\s+/g, " ").trim();
  if (!sel) return;
  const rec = box.dataset.text;
  const err = box.closest("[data-rec]").querySelector("[data-err]");
  if (!box.textContent.includes(sel)) { err.textContent = "Select words within one record only."; return; }
  err.textContent = "";
  const d = S.drafts[rec];
  if (d.rows.some((r) => r.quote === sel)) return;
  const item = ITEMS.get(rec);
  const cand = item?.candidates?.find((c) => c.quote.includes(sel) || sel.includes(c.quote));
  const row = { quote: sel, mode: cand?.mode ?? "decides", decided_by: cand?.decided_by ?? item?.author ?? S.meta.people[0].id, topic: cand?.topic ?? "", eff_date: "", eff_time: "", eff_from: "", question: "" };
  d.rows.push(row);
  window.getSelection().removeAllRanges();
  rerenderItem(rec);
  const s = (await api(`/api/effective?record=${encodeURIComponent(rec)}&quote=${encodeURIComponent(sel)}`)).body;
  Object.assign(row, { eff_date: s.local.slice(0, 10), eff_time: s.local.slice(11, 16), eff_from: s.from });
  rerenderItem(rec);
});

document.addEventListener("change", (e) => {
  const box = e.target.closest?.("[data-i]");
  const rec = itemOf(e.target);
  if (!box || !rec || !e.target.dataset.f) return;
  const r = S.drafts[rec].rows[Number(box.dataset.i)];
  r[e.target.dataset.f] = e.target.value;
  if (e.target.dataset.f === "eff_date" || e.target.dataset.f === "eff_time") r.eff_from = "your edit";
  if (["mode", "topic", "decided_by"].includes(e.target.dataset.f) || e.target.dataset.f.startsWith("eff_")) rerenderItem(rec);
});
document.addEventListener("input", (e) => {
  if (e.target.dataset?.reason) S.drafts[e.target.dataset.reason].reason = e.target.value;
  if (e.target.dataset?.f === "question") {
    const rec = itemOf(e.target);
    S.drafts[rec].rows[Number(e.target.closest("[data-i]").dataset.i)].question = e.target.value;
  }
});

document.addEventListener("click", async (e) => {
  const t = e.target.closest?.("button, [data-judge], [data-close], .toggle, [data-goto]");
  if (!t) return;
  if (t.dataset.close !== undefined) return closeSheet();
  if (t.dataset.jump) return document.getElementById(t.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
  if (t.dataset.confirmFirst) {
    const box = t.closest(".tc");
    const err = box.querySelector("[data-err]");
    const reviewer = reviewerEl.value.trim();
    const reason = box.querySelector("[data-firstq-reason]").value.trim();
    if (!reviewer) { err.textContent = "Enter a reviewer name at the top."; return; }
    if (!reason) { err.textContent = "A reason is required."; return; }
    t.disabled = true;
    const r = await api("/api/judgments", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ doc_id: t.dataset.confirmFirst, verdict: "document_ok", reason, reviewer, memory_items: Number(box.dataset.n) }) });
    if (r.status !== 201) { t.disabled = false; err.textContent = r.body.errors.join("; "); return; }
    await Promise.all([loadLedger(), loadJobs(), loadValue()]);
    return go({});
  }
  if (t.dataset.quick) {
    const err = t.closest(".tc").querySelector("[data-err]");
    const reviewer = reviewerEl.value.trim();
    if (!reviewer) { err.textContent = "Enter a reviewer name at the top."; return; }
    t.disabled = true;
    const r = await api("/api/judgments", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ record_id: t.dataset.quick, verdict: "no_decision", cards: [], reason: QUICK_REASON, reviewer }) });
    if (r.status !== 201) { t.disabled = false; err.textContent = r.body.errors.join("; "); return; }
    await Promise.all([loadLedger(), loadJobs(), loadValue()]);
    return go({});
  }
  if (t.dataset.judge) return openSheet(t.dataset.judge);
  if (t.dataset.goto) return go({ tab: "outbox", doc: t.dataset.goto });
  if (t.classList.contains("toggle")) {
    const open = t.closest(".ev").classList.toggle("open");
    t.textContent = open ? "Hide" : "Show full text";
    return;
  }
  const act = t.dataset.act;
  if (!act) return;
  const rec = itemOf(t);
  if (!rec) return;
  const d = S.drafts[rec];
  if (act === "drop") { d.rows.splice(Number(t.closest("[data-i]").dataset.i), 1); return rerenderItem(rec); }
  if (act === "tomode") { d.rows[Number(t.closest("[data-i]").dataset.i)].mode = t.dataset.mode; return rerenderItem(rec); }
  const err = t.closest("[data-rec]").querySelector("[data-err]");
  const reviewer = reviewerEl.value.trim();
  if (!reviewer) { err.textContent = "Enter a reviewer name at the top."; return; }
  if (!d.reason.trim()) { err.textContent = "A reason is required."; return; }
  const body = act === "none"
    ? { record_id: rec, verdict: "no_decision", cards: [], reason: d.reason, reviewer }
    : { record_id: rec, verdict: "cards", reason: d.reason, reviewer, cards: d.rows.map((r) => ({
        mode: r.mode, quote: r.quote, decided_by: r.decided_by,
        ...(r.topic ? { topic: r.topic } : {}),
        ...(r.eff_date ? { effective: `${r.eff_date}T${r.eff_time || "00:00"}` } : {}),
        ...(r.question.trim() ? { open_question: r.question.trim() } : {}),
      })) };
  t.disabled = true;
  const r = await api("/api/judgments", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  t.disabled = false;
  if (r.status !== 201) { err.textContent = r.body.errors.join("; "); return; }
  delete S.drafts[rec];
  closeSheet();
  // The judgment changes the ledger, the money by state and this document's verdict: re-run the check.
  await Promise.all([loadLedger(), loadJobs(), loadValue()]);
  await go({});
});

// ---------- job, Needs you, Ledger ----------

async function showJob(job) {
  if (!job) return;
  S.job = job;
  const j = S.jobs.find((x) => x.job === job);
  const q = (await api(`/api/queue?job=${encodeURIComponent(job)}`)).body;
  $("main").innerHTML = `<div class="crumb">${esc(job)}<i>·</i>${esc(j.client)}<i>·</i>${esc(j.trade)}</div>
    <div class="page-title">${esc(j.title)}</div>
    <div class="page-sub">Pick a document to check it as it was about to go out.</div>
    <div class="doclist">${j.docs.map((d) => `<div class="doc" data-goto="${esc(d.id)}"><i class="sdot ${d.state}"></i><span class="doc-id">${esc(d.id)}</span><span class="doc-amt">${esc(day(d.at))}</span><span class="doc-amt">${money2(d.total)}</span>${pill(d.state, d.left)}</div>`).join("")}</div>`;
  $(".right").innerHTML = queuePanel(q, false);
}

// The outbox as a to-do list for the view in use: what to fix, what is left to confirm, what is ready.
async function showOutbox() {
  const docs = S.jobs.flatMap((j) => j.docs.map((d) => ({ ...d, job: j.job, title: j.title, client: j.client }))).filter((d) => !S.viewIds || S.viewIds.has(d.id));
  const groups = [
    ["warnings", "Fix before sending", (d) => "Named problems found; fix them before it goes out."],
    ["not_cleared", "Left to confirm", (d) => (d.left ? `${leftText(d.left)} before it can clear` : "Not cleared: waiting on the Judge step")],
    ["clear", "Ready to send", () => "Every record is accounted for."],
  ];
  $("main").innerHTML = `<div class="page-title">${S.view === "sample" ? "Today's outbox" : S.view === "curated" ? "Outbox — curated view" : "Outbox — all documents"}</div>
    <div class="page-sub">Each document is checked as it was about to go out. Open one to see why, and confirm what is left in place.</div>
    ${groups.map(([st, label, what]) => { const xs = docs.filter((d) => d.state === st); return xs.length ? `<div class="obx-group"><div class="section-label">${label} (${xs.length})</div>
      ${xs.map((d) => `<div class="obx-row" data-goto="${esc(d.id)}"><i class="sdot ${d.state}"></i><span class="doc-id">${esc(d.id)}</span><span class="what">${esc(d.title)} · ${esc(d.client)} — ${esc(what(d))}</span><span class="doc-amt">${money2(d.total)}</span>${pill(d.state, d.left)}</div>`).join("")}</div>` : ""; }).join("")}`;
  $(".right").innerHTML = `<div class="rp-label">The ledger</div><div class="empty">${esc(S.ledger?.line ?? "")}</div>`;
}

async function showNeeds() {
  const q = (await api("/api/queue")).body;
  for (const x of [...q.needs_human, ...q.spot_check, ...q.confirmed]) ITEMS.set(x.record_id, x);
  const byJob = new Map();
  for (const x of q.needs_human) byJob.set(x.job ?? "(no job)", [...(byJob.get(x.job ?? "(no job)") ?? []), x]);
  $("main").innerHTML = `<div class="page-title">Needs you</div>
    <div class="page-sub">${q.needs_human.length} records the system cannot vouch for, with their original text. Judging one moves it to confirmed.</div>
    ${[...byJob].map(([job, xs]) => `<div class="section-label">${esc(job)} · ${esc(S.jobs.find((j) => j.job === job)?.title ?? "")}</div><div class="grid2">${xs.map((x) => nhHtml(x, "need")).join("")}</div>`).join("")}`;
  $(".right").innerHTML = `<div class="rp-label">The ledger</div><div class="empty">${esc(S.ledger?.line ?? "")}</div>
    <details class="group"><summary>Model found nothing here — spot-check (${q.spot_check.length})</summary>${q.spot_check.map((x) => nhHtml(x, "spot")).join("")}</details>`;
}

async function showLedger() {
  const l = S.ledger ?? (await api("/api/ledger")).body;
  $("main").innerHTML = `<div class="page-title">Ledger</div>
    <div class="page-sub">Every record lands in exactly one place. Nothing is dropped silently.</div>
    <div class="verdict ${l.complete ? "clear" : "warnings"}"><div class="verdict-text">${esc(l.line)}</div></div>
    <table class="ledger"><tr><th>Job</th><th>Client</th><th class="n">Need you</th><th class="n">Spot-check</th><th class="n">Confirmed</th><th class="n">Documents</th></tr>
      ${S.jobs.map((j) => `<tr><td><span class="job-id">${esc(j.job)}</span> ${esc(j.title)}</td><td>${esc(j.client)}</td><td class="n">${j.needs_human}</td><td class="n">${j.spot_check}</td><td class="n">${j.confirmed}</td><td class="n">${j.docs.length}</td></tr>`).join("")}</table>`;
  $(".right").innerHTML = `<div class="rp-label">Where records go</div>
    <div class="nh"><div class="nh-text"><b>auto</b> — the model made cards that passed the quote gate and the checker.</div></div>
    <div class="nh"><div class="nh-text"><b>empty</b> — a field note with no decision; open for spot-check.</div></div>
    <div class="nh"><div class="nh-text"><b>need you</b> — anything the system cannot vouch for: a failed or prose reply, a rejected card, or no decision found in a client message or office note.</div></div>
    <div class="nh"><div class="nh-text"><b>confirmed</b> — a person judged it; the latest judgment wins and the history stays.</div></div>`;
}

// A link to #doc=<id> (for example from the home page) opens that document's check.
window.addEventListener("hashchange", () => {
  const doc = location.hash.match(/doc=([\w-]+)/)?.[1];
  if (doc && doc !== S.doc) go({ tab: "outbox", doc });
});

(async () => {
  S.meta = (await api("/api/meta")).body;
  S.people = new Map(S.meta.people.map((p) => [p.id, p]));
  await Promise.all([loadLedger(), loadJobs(), loadValue()]);
  const hash = location.hash.match(/doc=([\w-]+)/)?.[1];
  await go(hash ? { tab: "outbox", doc: hash } : { tab: "outbox", job: null });
})().catch((e) => { $("main").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
